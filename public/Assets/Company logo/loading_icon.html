  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }

  .loader {
    position: relative;
    width: clamp(140px, 34vw, 220px);
    aspect-ratio: 340 / 117;
  }

  .logo-layer {
    position: absolute;
    inset: 0;
    background-image: var(--logo-uri);
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  /* Unlit base: dim, desaturated silhouette of the logo */
  .logo-dim {
    filter: brightness(0.2) saturate(0.35);
    opacity: 0.9;
  }

  /* Lit layer: full-color logo, revealed bottom-to-top */
  .logo-lit {
    clip-path: inset(100% 0 0 0);
    animation: fillUp 2.4s cubic-bezier(0.55, 0, 0.35, 1) infinite;
    filter: drop-shadow(0 0 8px rgba(238, 241, 255, 0.3));
  }

  /* Glow sweep, clipped to the logo's own silhouette via its alpha channel,
     so light only ever appears inside the shape's true boundaries */
  .charge-mask {
    position: absolute;
    inset: 0;
    overflow: hidden;
    -webkit-mask-image: var(--logo-uri);
    mask-image: var(--logo-uri);
    -webkit-mask-mode: alpha;
    mask-mode: alpha;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    mix-blend-mode: screen;
  }

  .charge-mask .band {
    position: absolute;
    left: -20%;
    right: -20%;
    height: 170%;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      transparent 38%,
      rgba(238, 241, 255, 0.95) 50%,
      transparent 62%,
      transparent 100%
    );
    filter: blur(2px);
    animation: sweep 2.4s cubic-bezier(0.55, 0, 0.35, 1) infinite;
  }

  @keyframes fillUp {
    0%   { clip-path: inset(100% 0 0 0); }
    58%  { clip-path: inset(0% 0 0 0); }
    82%  { clip-path: inset(0% 0 0 0); }
    100% { clip-path: inset(100% 0 0 0); }
  }

  @keyframes sweep {
    0%   { top: 120%; opacity: 0; }
    6%   { opacity: 1; }
    58%  { top: -120%; opacity: 1; }
    66%  { opacity: 0; }
    100% { top: -120%; opacity: 0; }
  }

  .label {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: rgba(238, 241, 255, 0.55);
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-lit { animation: none; clip-path: inset(0 0 0 0); }
    .band { animation: none; opacity: 0; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="loader">
      <div class="logo-layer logo-dim"></div>
      <div class="logo-layer logo-lit"></div>
      <div class="charge-mask"><div class="band"></div></div>
    </div>
    <div class="label">Loading…</div>
  </div>
</body>
</html>
